<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="Concert archive for Bhagya" />
    <title>Concerts | Bhagya</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎶</text></svg>" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,600;1,600&amp;display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,300;0,500;0,600;0,700;1,300;1,500;1,600;1,700&amp;display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,400;1,400&amp;display=swap" rel="stylesheet" />
    <link type="text/css" href="static/css/styles.css" rel="stylesheet" />
    <link type="text/css" href="static/css/main.css" rel="stylesheet" />
    <script type="text/javascript" src="static/js/js-yaml.min.js"></script>
</head>

<body class="concerts-page">
    <nav class="header navbar navbar-light fixed-top shadow-sm" id="mainNav">
        <div class="container px-5">
            <a class="navbar-brand fw-bold" href="index.html">Bhagya</a>
            <span class="concert-label">Concerts</span>
        </div>
    </nav>

    <header class="concerts-hero">
        <div class="container px-5">
            <div class="concerts-kicker">Personal archive / live music</div>
            <h1 class="mt-3">The live list.</h1>
            <p class="lead mt-4 mb-0">Every show I've been to, and the ones I'm counting down to.</p>
            <div class="concert-stat"><strong id="upcoming-count">0</strong> upcoming <span class="mx-2">/</span> <strong id="past-count">0</strong> past</div>
        </div>
    </header>

    <main class="concerts-workspace">
        <div class="container px-5">
            <div class="concert-toolbar">
                <div>
                    <div class="concert-label">Read-only archive</div>
                    <h2 class="mt-2 mb-0">Shows &amp; memories</h2>
                </div>
                <div class="d-flex gap-2 flex-wrap">
                    <label class="visually-hidden" for="search">Search concerts</label>
                    <input class="form-control" id="search" placeholder="Search artist, venue..." type="search" />
                    <label class="visually-hidden" for="sort">Sort concerts</label>
                    <select class="form-select" id="sort">
                        <option value="date">Sort by date</option>
                        <option value="artist">Sort by artist</option>
                        <option value="venue">Sort by venue</option>
                        <option value="city">Sort by city</option>
                        <option value="genre">Sort by genre</option>
                        <option value="status">Sort by status</option>
                        <option value="rating">Sort by rating</option>
                    </select>
                    <button class="concert-button secondary" id="sort-direction" type="button" aria-label="Sort ascending" title="Sort ascending"><i class="bi-sort-down"></i></button>
                </div>
            </div>
            <div class="concert-section" aria-labelledby="upcoming-title">
                <div class="concert-section-heading">
                    <div class="concert-label">Next on the calendar</div>
                    <h2 id="upcoming-title">Upcoming</h2>
                </div>
                <div id="upcoming-list" aria-live="polite"></div>
            </div>
            <div class="concert-section" aria-labelledby="past-title">
                <div class="concert-section-heading">
                    <div class="concert-label">The archive</div>
                    <h2 id="past-title">Past</h2>
                </div>
                <div id="past-list" aria-live="polite"></div>
            </div>
        </div>
    </main>

    <footer class="bg-bottom text-center py-5"><div class="container px-5"><div class="text-white-50 small">&copy; Bhagya 2026. All Rights Reserved.</div></div></footer>
    <script src="static/js/concerts.js"></script>
</body>

</html>
