<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Bhagya's live music reviews: every show scored out of 10, plus what's coming up." />
    <title>Bhagya · Live Reviews</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎶</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Young+Serif&display=swap" rel="stylesheet" />
    <link href="static/css/main.css" rel="stylesheet" />
    <script src="static/js/js-yaml.min.js"></script>
</head>

<body>
    <header class="hero">
        <div class="container">
            <div class="kicker">Personal archive / live music</div>
            <h1 class="wordmark">Bhagya<span>.</span></h1>
            <p class="tagline">Live reviews. Every show scored out of 10.</p>
            <div class="stats" id="stats"></div>
        </div>
    </header>

    <main class="container">
        <section aria-labelledby="upcoming-title">
            <div class="section-head">
                <span class="label">Next on the calendar</span>
                <h2 id="upcoming-title">Coming up</h2>
            </div>
            <ol class="rail" id="upcoming"></ol>
        </section>

        <section aria-labelledby="reviews-title">
            <div class="section-head">
                <span class="label">The archive</span>
                <h2 id="reviews-title">Reviews</h2>
            </div>
            <div class="feed" id="reviews"></div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">&copy; Bhagya 2026</div>
    </footer>

    <script src="static/js/concerts.js"></script>
</body>

</html>
