<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Every concert I'm going to and every one I've been to: the songs, the friends, the scores, and my reviews." />
    <meta name="theme-color" content="#121212" />
    <title>concerts</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎶</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Figtree:wght@400;500;600;700;800&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="static/css/main.css?v=7" rel="stylesheet" />
    <script src="static/js/js-yaml.min.js"></script>
</head>

<body>
    <main class="app" id="app" data-side="a">
        <div class="pl-bar">
            <button class="pl-who" type="button" aria-controls="about" aria-expanded="false" aria-label="About">
                <span class="pl-who-face" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3.5a4.2 4.2 0 1 1 0 8.4 4.2 4.2 0 0 1 0-8.4zM4.5 20.2c.6-4 3.6-6.3 7.5-6.3s6.9 2.3 7.5 6.3z" /></svg></span>
                <span>about</span>
            </button>
            <button class="pl-rec" type="button" aria-label="Flip to side B"><span>A</span></button>
        </div>
        <div class="pl-side pl-a"><p class="empty" style="padding: 80px 16px">Loading…</p></div>
        <div class="pl-side pl-b" hidden></div>
        <div class="pl-side pl-about" id="about" role="region" aria-label="About" hidden></div>
        <div class="mx-dock">
            <div class="mx-sheet" role="dialog" aria-modal="false" aria-label="Show details" hidden></div>
            <div class="pl-mini-in"></div>
        </div>
    </main>

    <script src="static/js/concerts.js?v=7"></script>
</body>

</html>
