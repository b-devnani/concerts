#   venue, city, country, genre,
#   rating        score out of 10
#   price         what you paid, e.g. "$35" or Free
#   companions    who you went with ("Alone" shows as "Went solo")
#   highlights    standout songs or moments
#   wishlist      songs you wish they played
#   review        your write-up; shown behind "Read review", exactly as typed
#   notes         short info shown on the card (e.g. "Doors 7 PM, 16+.")
#   link          tickets or event page
