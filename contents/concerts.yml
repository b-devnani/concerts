# Every show lives here. The page reads this file.
# Shows dated today or later appear under "Upcoming"; earlier ones become reviews.
#
# Fields (all optional except artist and date):
#   artist, date (YYYY-MM-DD), end_date (multi-day festivals), time ("20:00"),
#   venue, city, country, genre,
#   place         short label for punch cards: MSG, BK, NYC, NJ, DC, CHI, LOS, OAK, SF, India, VMAs, Afro+, Stanford, Coachella, Lolla, LID (Lost in Riddim), UIUC, SOB's, Soulection, Central Park, Barclays, Red Bull
#   status        Maybe for a show you might go to (it gets a "Maybe" tag); leave out when you're definitely going
#   rating        score out of 10
#   price         what you paid, e.g. "$35" or Free
#   companions    your friends, exactly as you typed them ("Alone" shows as "I went solo")
#   hook          one line that sums up a past show, shown on its row under Been there (exactly as typed)
#   seen_as       for a past show, the artist it counts for in contents/artists.yml (as typed in seen), so it adds a performance
#   photo         a picture for a past show, e.g. static/img/shows/dave.jpg (your own photos are best)
#   highlights    standout songs or moments
#   wishlist      songs you wish the artist played
#   review        your write-up; shown under "Review" when the show is opened, exactly as typed
#   notes         short info shown on the card (e.g. "Doors 7 PM, 16+.")
#   link          tickets or event page
#   pronoun       he or she, for "Wish He Performed" / "Wish She Performed" (leave out for bands and festivals)
#   song          your favorite song by the artist (upcoming shows get a play button)
#   spotify       Spotify track link for that song, e.g. https://open.spotify.com/track/...
#   preview       Spotify's 30-second clip of that song, which the player plays; python3 tools/clips.py fills it in
#   length        that song's length, e.g. "3:27" (shown on the player before it plays)
