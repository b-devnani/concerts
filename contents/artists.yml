# Bhagya's all-time lists, exactly as Bhagya typed them (see docs/adr/0001). Do not tidy spelling or names.
# seen: every artist Bhagya has seen live, in Bhagya's order. "(x3)" means seen three times.
# need_to_see: Bhagya's die-peacefully list, under Bhagya's own heading. A ✅ here means seen; the page shows it crossed out.
# tag_along: artists Bhagya wouldn't mind tagging along to see, under Bhagya's own heading. Bhagya asked for these names in each
#   artist's own styling (as on Spotify), so this list is the one place names aren't as typed.
# fav_artists, fav_concerts: Bhagya's top fives, in Bhagya's order, shown on the about page. fav_artists_also: more fav
#   artists, in no order (they can include artists Bhagya hasn't seen yet, like Rihanna). Names are as in seen; the page
#   shows each artist's own styling (Aminé, Odunsi (The Engine)). A fav concert is one performance (artist, year, place), the
#   venue the page shows for it, Bhagya's rank (ties allowed: 1, 1, 1, 4, 5) and a short review, exactly as typed.
# punch_details: what Bhagya remembers about older punches (year, score out of 10, place, note), keyed by the name as typed in seen.
#   Punches from diary shows fill themselves in; these are the ones from before the diary.
